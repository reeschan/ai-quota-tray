# Temporary check that the Windows installer build succeeds.
# Removed after the run is green. This workflow does not publish a release.
name: bundle-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    name: windows tauri bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build MSI and NSIS bundles
        working-directory: apps/desktop
        run: npm run tauri -- build -- --bundles msi,nsis
